services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: analytics-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (HTTP API, most .NET ClickHouse clients)
      - "9000:9000"   # native TCP protocol (clickhouse-client, native-protocol clients)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?set in .env}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    container_name: analytics-postgres
    ports:
      - "5433:5432"   # host 5433 -> container 5432, since you likely already have another
                       # Postgres bound to host 5432. Inside Docker, other containers on this
                       # project's network still reach it as postgres:5432.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      # postgres:18+ images manage a major-version subdirectory themselves and
      # expect the volume mounted at /var/lib/postgresql (not .../data) --
      # https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Downloads MaxMind's free GeoLite2-City database into ./data/geoip and
  # refreshes it every 72 hours. The API only reads the .mmdb file, so the
  # licence key lives here (via .env) and never in the API's configuration.
  # Without MAXMIND_* in .env this container just exits; everything else still
  # works and events get empty geo columns.
  # Docs: https://github.com/maxmind/geoipupdate/blob/main/doc/docker.md
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v8.0.0
    container_name: analytics-geoipupdate
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: 72
    volumes:
      # A folder in the repo (gitignored) rather than a Docker volume, so the
      # API running from Visual Studio can read the same file.
      - ./data/geoip:/usr/share/GeoIP

volumes:
  clickhouse-data:
  postgres-data: